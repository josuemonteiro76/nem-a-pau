<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nem a Pato! 🦆</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg: #F3F4F6;
            --card-bg: #FFFFFF;
            --text: #1F2937;
            --success: #10B981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #E0E7FF 0%, #F3F4F6 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            margin-top: 20px;
        }

        .header h1 { font-size: 2.5rem; color: var(--primary); }

        .scoreboard {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .player-score {
            background: var(--card-bg);
            padding: 15px 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            min-width: 140px;
        }

        .score-number {
            display: block;
            font-size: 2rem;
            color: var(--primary);
            margin-top: 5px;
        }

        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            width: 100%;
            text-align: center;
            position: relative;
        }

        .question {
            font-size: 1.4rem;
            line-height: 1.5;
            margin-bottom: 30px;
            font-weight: 500;
        }

        .answer-box {
            display: none;
            background: #D1FAE5;
            color: #065F46;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 30px;
            animation: fadeIn 0.3s ease-in;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
            margin-bottom: 10px;
        }

        button:hover { background: var(--primary-hover); }

        .scoring-buttons {
            display: none;
            gap: 10px;
            flex-direction: column;
            animation: fadeIn 0.3s ease-in;
        }

        .btn-p1 { background: #3B82F6; }
        .btn-p1:hover { background: #2563EB; }
        .btn-p2 { background: #EC4899; }
        .btn-p2:hover { background: #DB2777; }
        .btn-skip { background: #6B7280; }
        .btn-skip:hover { background: #4B5563; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .empty-state { display: none; font-size: 1.5rem; color: #6B7280; }
    </style>
</head>
<body>

    <div class="header">
        <h1>Nem a Pato! 🦆</h1>
        <p>Aumente o palpite ou duvide!</p>
    </div>

    <div class="scoreboard">
        <div class="player-score">
            Josué
            <span class="score-number" id="score-p1">0</span>
        </div>
        <div class="player-score">
            Mirella
            <span class="score-number" id="score-p2">0</span>
        </div>
    </div>

    <div class="card" id="game-card">
        <div class="question" id="question-text">Carregando pergunta...</div>
        
        <div class="answer-box" id="answer-text"></div>

        <button id="btn-reveal" onclick="revealAnswer()">Ver Resposta Exata</button>

        <div class="scoring-buttons" id="scoring-section">
            <p style="margin-bottom: 15px; font-weight: bold; color: #4B5563;">Quem ganhou o ponto?</p>
            <button class="btn-p1" onclick="addPoint(1)">Ponto para Josué</button>
            <button class="btn-p2" onclick="addPoint(2)">Ponto para Mirella</button>
            <button class="btn-skip" onclick="nextQuestion()">Ninguém (Pular)</button>
        </div>
    </div>

    <div class="empty-state" id="empty-state">
        🎉 Vocês zeraram o jogo! Atualize a página para jogar de novo.
    </div>

    <script>
        // Banco de perguntas (adicione quantas quiser seguindo este padrão)
        let questions = [
            { q: "Quantos dentes-de-leão (sementes) existem em média em uma flor madura?", a: "50" },
            { q: "Quantos metros de altura tem a Estátua da Liberdade (com a base)?", a: "93" },
            { q: "Qual é o recorde mundial de bananas comidas em 1 minuto?", a: "8" },
            { q: "Quantos dias um camelo sobrevive no deserto sem água no calor do verão?", a: "15" },
            { q: "Quantas teclas tem um piano acústico tradicional completo?", a: "88" },
            { q: "Quantos ossos tem o corpo humano adulto?", a: "206" },
            { q: "Quantos dias leva para a Lua dar uma volta completa na Terra?", a: "27" },
            { q: "Quantos quilômetros de extensão tem a Grande Muralha da China?", a: "21.196" },
            { q: "Qual é a altura exata, em metros, do prédio Burj Khalifa?", a: "828" },
            { q: "Quantos dias durou a Guerra dos Cem Anos?", a: "42.518" },
            { q: "Quantas peças compõem o cubo mágico 3x3x3 original?", a: "26" },
            { q: "Quantos caracteres tem a primeira frase do livro Dom Casmurro?", a: "62" },
            { q: "Quantos assentos tem o estádio do Maracanã atualmente?", a: "78.838" },
            { q: "Quantos corações tem um polvo?", a: "3" },
            { q: "Quantos episódios no total tem a série Friends?", a: "236" },
            { q: "Quantos fusos horários existem na Rússia?", a: "11" },
            { q: "Quantos litros de sangue tem, em média, um adulto humano de 70kg?", a: "5" },
            { q: "Quantos meses de gestação tem um elefante africano?", a: "22" }
        ];

        let scoreP1 = 0;
        let scoreP2 = 0;
        let currentQuestion = null;

        // Embaralha as perguntas ao iniciar
        questions = questions.sort(() => Math.random() - 0.5);

        function loadNextQuestion() {
            if (questions.length === 0) {
                document.getElementById('game-card').style.display = 'none';
                document.getElementById('empty-state').style.display = 'block';
                return;
            }

            currentQuestion = questions.pop();
            
            document.getElementById('question-text').innerText = currentQuestion.q;
            document.getElementById('answer-text').innerText = currentQuestion.a;
            
            // Reset UI states
            document.getElementById('answer-text').style.display = 'none';
            document.getElementById('scoring-section').style.display = 'none';
            document.getElementById('btn-reveal').style.display = 'block';
        }

        function revealAnswer() {
            document.getElementById('answer-text').style.display = 'block';
            document.getElementById('btn-reveal').style.display = 'none';
            document.getElementById('scoring-section').style.display = 'flex';
        }

        function addPoint(player) {
            if (player === 1) {
                scoreP1++;
                document.getElementById('score-p1').innerText = scoreP1;
            } else {
                scoreP2++;
                document.getElementById('score-p2').innerText = scoreP2;
            }
            nextQuestion();
        }

        function nextQuestion() {
            loadNextQuestion();
        }

        // Inicia o jogo
        loadNextQuestion();
    </script>
</body>
</html>
